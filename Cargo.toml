[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The stand-in title is a freestanding image with its own profile; tests build it on demand.
exclude = ["tests/fixtures/stand-in-title"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
