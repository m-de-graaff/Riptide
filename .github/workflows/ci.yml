name: CI

on:
  push:
  pull_request:

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, clippy, test, policy
    runs-on: windows-latest
    # A branch pushed with an open pull request would otherwise run twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain; this installs it with rustfmt and clippy.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Tests that need the target machine's hardware are marked #[ignore] and stay ignored.
      - name: Test
        run: cargo test --workspace --locked

      - name: Policy
        run: cargo xtask policy
