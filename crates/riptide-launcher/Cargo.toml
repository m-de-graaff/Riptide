[package]
name = "riptide-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
riptide-config = { path = "../riptide-config" }
riptide-log = { path = "../riptide-log" }
riptide-preflight = { path = "../riptide-preflight" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.18"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1"
